# Numbers and units (MVP §37)
#
# MVP §37 names three forms of the same answer and requires all of them to
# be understood:
#
#     "ఆరు వేలు"   "6000"   "six thousand"
#
# These use `kind: number`: they assert that a spoken quantity reads as a
# figure, without running a conversation. They are deterministic and free,
# and a Telugu speaker can add cases here without touching Python.
#
# This matters more than it looks. Scoring compares monthly_bill against a
# threshold and treats an unreadable value as "no" rather than erroring, so
# a bill the system cannot read costs the customer their points in silence.

# --- The three forms §37 names -------------------------------------------

- id: num-six-thousand-telugu
  kind: number
  description: §37's first form — Telugu words
  language: te-IN
  dialect: telangana
  tags: [numbers, bill]
  spoken: "ఆరు వేలు"
  expect: 6000

- id: num-six-thousand-digits
  kind: number
  description: §37's second form — digits
  language: en-IN
  dialect: english
  tags: [numbers, bill]
  spoken: "6000"
  expect: 6000

- id: num-six-thousand-english
  kind: number
  description: §37's third form — English words
  language: en-IN
  dialect: english
  tags: [numbers, bill]
  spoken: "six thousand"
  expect: 6000

