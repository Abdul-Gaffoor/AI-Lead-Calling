services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: swaraj
      POSTGRES_PASSWORD: swaraj
      POSTGRES_DB: swaraj_solar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swaraj -d swaraj_solar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
