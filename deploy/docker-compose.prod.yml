# Production stack, deployed to the server by .github/workflows/deploy.yml.
# Values come from the .env file the workflow writes next to this file.

x-app-env: &app-env
  # Parts, not a pre-built URL: a password is arbitrary text, and an "@" or
  # "/" inside one silently re-points a DSN at another host. The app
  # percent-encodes these when it assembles the connection string.
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: swaraj
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: swaraj_solar
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET}
  AUTO_CREATE_TABLES: "false"
  # Requests reach the API only from Traefik on the Docker network, so the
  # X-Forwarded-* headers it sets are trustworthy.
  FORWARDED_ALLOW_IPS: "*"
  # Telephony — defaults to the mock provider so no real calls are placed
  # until a cloud-telephony account and virtual number are provisioned.
  TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-mock}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  TELEPHONY_WEBHOOK_TOKEN: ${TELEPHONY_WEBHOOK_TOKEN:-}
  EXOTEL_SID: ${EXOTEL_SID:-}
  EXOTEL_API_KEY: ${EXOTEL_API_KEY:-}
  EXOTEL_API_TOKEN: ${EXOTEL_API_TOKEN:-}
  EXOTEL_CALLER_ID: ${EXOTEL_CALLER_ID:-}
  EXOTEL_SUBDOMAIN: ${EXOTEL_SUBDOMAIN:-api.exotel.com}
  EXOTEL_FLOW_APP_ID: ${EXOTEL_FLOW_APP_ID:-}
  EXOTEL_STATUS_CALLBACK_EVENTS: ${EXOTEL_STATUS_CALLBACK_EVENTS:-terminal}
  EXOTEL_MAX_RETRIES: ${EXOTEL_MAX_RETRIES:-2}
  # A call with no status callback after this long is failed out so its
  # concurrency slot returns to the campaign.
  STUCK_CALL_TIMEOUT_MINUTES: ${STUCK_CALL_TIMEOUT_MINUTES:-30}
  # Call recordings. "local" writes to the recordings volume below; switch to
  # "s3" with a bucket when they outgrow one disk.
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
  STORAGE_DIR: /var/lib/swaraj/recordings
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  # Download the recording the telephony provider reports on its webhook.
  FETCH_PROVIDER_RECORDINGS: ${FETCH_PROVIDER_RECORDINGS:-false}
  # 0 keeps audio indefinitely; set a number of days to age it out.
  RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-0}
  # Knowledge base embeddings — mock by default (offline, no spend)
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-voyage-3}
  # AI voice pipeline — defaults to mocks (no network calls, no spend)
  SPEECH_PROVIDER: ${SPEECH_PROVIDER:-mock}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  VOICE_PROVIDER: ${VOICE_PROVIDER:-mock}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-claude-opus-5}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
  ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_v3}
  ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-mp3_22050_32}

services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    environment: *app-env
    # Loopback only: the outside world reaches the API through Traefik over
    # HTTPS. Publishing 8000 here would leave a plaintext door open, but
    # keeping it on localhost lets the deploy health-check and admin commands
    # reach it from the host.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - recordings:/var/lib/swaraj/recordings
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.swaraj.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.swaraj.entrypoints=websecure"
      - "traefik.http.routers.swaraj.tls.certresolver=le"
      - "traefik.http.routers.swaraj.middlewares=swaraj-security"
      - "traefik.http.services.swaraj.loadbalancer.server.port=8000"
      # HSTS means a browser refuses
      # plaintext for a year after one good HTTPS response.
      - "traefik.http.middlewares.swaraj-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.swaraj-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.swaraj-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.swaraj-security.headers.frameDeny=true"
      - "traefik.http.middlewares.swaraj-security.headers.referrerPolicy=strict-origin-when-cross-origin"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Call dispatcher: places due calls for running campaigns on a schedule.
  worker:
    image: ${APP_IMAGE}
    command: ["worker"]
    restart: unless-stopped
    environment: *app-env
    # The retention task deletes expired audio, so the worker needs the store.
    volumes:
      - recordings:/var/lib/swaraj/recordings
    depends_on:
      app:
        condition: service_healthy

  # TLS terminator and router (MVP section 32). Reads the routing rules from
  # the labels on the app service above, and gets its certificate from Let's
  # Encrypt automatically.
  #
  # NOTE ON THE DOCKER SOCKET: the docker provider needs it to read those
  # labels, and socket access is effectively root on this host — an escape in
  # an internet-facing proxy would own the machine. It is mounted read-only,
  # which limits little, because the socket is an API rather than a file. If
  # that trade is not acceptable, put a socket proxy (tecnativa/docker-socket-
  # proxy) in front of it, or swap to Traefik's file provider: there is only
  # one backend here, so a static route costs nothing.
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      # Nothing is exposed unless it opts in with traefik.enable=true.
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      # HTTP-01: Let's Encrypt calls back on port 80, so that port has to be
      # open to the internet even though everything redirects to HTTPS.
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      # The dashboard and API stay off: they would expose the whole routing
      # table, unauthenticated, on a public host.
      - "--api.dashboard=false"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Certificates live here. Losing this volume means re-issuing on every
      # deploy, which hits Let's Encrypt's rate limit and takes HTTPS down.
      - letsencrypt:/letsencrypt
    depends_on:
      app:
        condition: service_healthy

  db:
    # pgvector build of PostgreSQL 16 — same server, plus the `vector`
    # extension the knowledge base needs. Changing this image over an
    # existing data volume: see the note in docs/DEPLOYMENT.md.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: swaraj
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: swaraj_solar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swaraj -d swaraj_solar"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
  letsencrypt:
  # Call audio. Survives redeploys like the database does; deleting it loses
  # every recording that has not aged out.
  recordings:
