# Production stack, deployed to the server by .github/workflows/deploy.yml.
# Values come from the .env file the workflow writes next to this file.

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg2://swaraj:${POSTGRES_PASSWORD}@db:5432/swaraj_solar
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET}
  AUTO_CREATE_TABLES: "false"
  # Requests reach the API only from Caddy on the Docker network, so the
  # X-Forwarded-* headers it sets are trustworthy.
  FORWARDED_ALLOW_IPS: "*"
  # Telephony — defaults to the mock provider so no real calls are placed
  # until a cloud-telephony account and virtual number are provisioned.
  TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-mock}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  TELEPHONY_WEBHOOK_TOKEN: ${TELEPHONY_WEBHOOK_TOKEN:-}
  EXOTEL_SID: ${EXOTEL_SID:-}
  EXOTEL_API_KEY: ${EXOTEL_API_KEY:-}
  EXOTEL_API_TOKEN: ${EXOTEL_API_TOKEN:-}
  EXOTEL_CALLER_ID: ${EXOTEL_CALLER_ID:-}
  EXOTEL_SUBDOMAIN: ${EXOTEL_SUBDOMAIN:-api.exotel.com}
  EXOTEL_FLOW_APP_ID: ${EXOTEL_FLOW_APP_ID:-}
  # Knowledge base embeddings — mock by default (offline, no spend)
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-voyage-3}
  # AI voice pipeline — defaults to mocks (no network calls, no spend)
  SPEECH_PROVIDER: ${SPEECH_PROVIDER:-mock}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  VOICE_PROVIDER: ${VOICE_PROVIDER:-mock}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-claude-opus-5}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
  ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_v3}
  ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-mp3_22050_32}

services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    environment: *app-env
    # Loopback only: the outside world reaches the API through Caddy over
    # HTTPS. Publishing 8000 here would leave a plaintext door open.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Call dispatcher: places due calls for running campaigns on a schedule.
  worker:
    image: ${APP_IMAGE}
    command: ["worker"]
    restart: unless-stopped
    environment: *app-env
    depends_on:
      app:
        condition: service_healthy

  # TLS terminator (MVP section 32). Obtains and renews its certificate
  # automatically; see deploy/Caddyfile for the two settings it reads.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TLS_ISSUER: ${TLS_ISSUER:-internal}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the internal CA live here; losing this volume means
      # re-issuing on every deploy and hitting Let's Encrypt rate limits.
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      app:
        condition: service_healthy

  db:
    # pgvector build of PostgreSQL 16 — same server, plus the `vector`
    # extension the knowledge base needs. Changing this image over an
    # existing data volume: see the note in docs/DEPLOYMENT.md.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: swaraj
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: swaraj_solar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swaraj -d swaraj_solar"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
