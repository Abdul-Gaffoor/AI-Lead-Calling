name: CI & Deploy

on:
  push:
    branches:
      - main
      - claude/elegant-goodall-7skooc
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run test suite
        run: python -m pytest -q

  build:
    name: Build & push Docker image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: meta
        # GHCR requires a lowercase repository path
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Deployment config lives in this GitHub environment — as environment
    # secrets or environment variables (secrets win when both exist).
    environment: Test
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY || vars.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || vars.SERVER_PORT || 22 }}
          source: deploy/docker-compose.prod.yml
          target: /opt/swaraj-solar
          strip_components: 1

      - name: Deploy stack
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || vars.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || vars.POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY || vars.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || vars.SERVER_PORT || 22 }}
          envs: APP_IMAGE,GHCR_USER,GHCR_TOKEN,JWT_SECRET,POSTGRES_PASSWORD
          script: |
            set -e
            cd /opt/swaraj-solar

            umask 077
            cat > .env <<EOF
            APP_IMAGE=${APP_IMAGE}
            JWT_SECRET=${JWT_SECRET}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            EOF

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f

            echo "Waiting for the API to become healthy..."
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
                echo "Deployment healthy."
                exit 0
              fi
              sleep 5
            done
            echo "API did not become healthy in time; recent logs:"
            docker compose -f docker-compose.prod.yml logs --tail 100 app
            exit 1
