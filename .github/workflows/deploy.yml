name: CI & Deploy

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run test suite
        run: python -m pytest -q

      # The deterministic half of the MVP §37 corpus already runs above as
      # tests/telugu. This prints the §38 measures into the build log, so
      # the accuracy and latency numbers are visible per commit rather than
      # only when somebody runs the command by hand. It needs no AI
      # provider and makes no network call.
      - name: Telugu evaluation (MVP §37)
        env:
          DATABASE_URL: "sqlite://"
          JWT_SECRET: "ci-evaluation-secret-0123456789abcdef"
        run: python -m backend.cli evaluate

  migrations:
    name: Verify migrations on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector build of the same PostgreSQL 16: the knowledge base
        # migration creates the `vector` extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: swaraj
          POSTGRES_PASSWORD: swaraj
          POSTGRES_DB: swaraj_solar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swaraj -d swaraj_solar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://swaraj:swaraj@localhost:5432/swaraj_solar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # Apply revisions one at a time, in separate processes, exactly as
      # successive deploys do — this catches errors (such as re-creating an
      # existing enum type) that a single all-at-once run would hide.
      - name: Apply each migration in its own process
        run: |
          set -e
          # Stop when the database reaches head, checked BEFORE trying to move.
          # Comparing successive `alembic current` values instead only notices
          # there is nothing left after `upgrade +1` has already failed at head
          # — and on a fresh database `current` prints nothing, so an empty
          # starting value matched immediately and the loop applied nothing at
          # all, leaving the all-at-once `upgrade head` as the only thing that
          # ran. That is exactly the single-process case this step exists to
          # avoid, because it hides a duplicate CREATE TYPE.
          target=$(alembic -c database/alembic.ini heads 2>/dev/null | head -1 | awk '{print $1}')
          test -n "$target"
          for _ in $(seq 1 100); do
            current=$(alembic -c database/alembic.ini current 2>/dev/null | head -1 | awk '{print $1}')
            [ "$current" = "$target" ] && break
            alembic -c database/alembic.ini upgrade +1
          done
          alembic -c database/alembic.ini current

      - name: Downgrade and re-apply the latest migration
        run: |
          set -e
          alembic -c database/alembic.ini downgrade -1
          alembic -c database/alembic.ini upgrade head

      - name: Run the test suite against PostgreSQL
        run: python -m pytest -q

  build:
    name: Build & push Docker image
    needs: [test, migrations]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: meta
        # GHCR requires a lowercase repository path
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Deployment config lives in this GitHub environment — as environment
    # secrets or environment variables (secrets win when both exist).
    environment: Test
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY || vars.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || vars.SERVER_PORT || 22 }}
          source: deploy/docker-compose.prod.yml
          target: ${{ vars.DEPLOY_DIR || '/opt/swaraj-solar' }}
          strip_components: 1

      - name: Deploy stack
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || vars.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || vars.POSTGRES_PASSWORD }}
          # TLS — Traefik routes on Host(DOMAIN) and gets a Let's Encrypt
          # certificate for it. Both are required.
          DOMAIN: ${{ vars.DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          # Where the stack lives on the server. Defaults to /opt, which
          # needs root to create; point it inside the deploy user's home
          # (e.g. /home/deploy/swaraj-solar) for an unprivileged deploy.
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/swaraj-solar' }}
          # Telephony — optional; defaults to the mock provider (no real calls)
          TELEPHONY_PROVIDER: ${{ vars.TELEPHONY_PROVIDER || 'mock' }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          TELEPHONY_WEBHOOK_TOKEN: ${{ secrets.TELEPHONY_WEBHOOK_TOKEN }}
          EXOTEL_SID: ${{ secrets.EXOTEL_SID }}
          EXOTEL_API_KEY: ${{ secrets.EXOTEL_API_KEY }}
          EXOTEL_API_TOKEN: ${{ secrets.EXOTEL_API_TOKEN }}
          EXOTEL_CALLER_ID: ${{ vars.EXOTEL_CALLER_ID }}
          EXOTEL_SUBDOMAIN: ${{ vars.EXOTEL_SUBDOMAIN || 'api.exotel.com' }}
          EXOTEL_FLOW_APP_ID: ${{ vars.EXOTEL_FLOW_APP_ID }}
          EXOTEL_STATUS_CALLBACK_EVENTS: ${{ vars.EXOTEL_STATUS_CALLBACK_EVENTS || 'terminal' }}
          EXOTEL_MAX_RETRIES: ${{ vars.EXOTEL_MAX_RETRIES || '2' }}
          STUCK_CALL_TIMEOUT_MINUTES: ${{ vars.STUCK_CALL_TIMEOUT_MINUTES || '30' }}
          # AI voice pipeline — optional; defaults to mocks (no spend)
          STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'local' }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          FETCH_PROVIDER_RECORDINGS: ${{ vars.FETCH_PROVIDER_RECORDINGS || 'false' }}
          RECORDING_RETENTION_DAYS: ${{ vars.RECORDING_RETENTION_DAYS || '0' }}
          EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER || 'mock' }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'voyage-3' }}
          SPEECH_PROVIDER: ${{ vars.SPEECH_PROVIDER || 'mock' }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'mock' }}
          VOICE_PROVIDER: ${{ vars.VOICE_PROVIDER || 'mock' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-opus-5' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID || 'eleven_v3' }}
          ELEVENLABS_OUTPUT_FORMAT: ${{ vars.ELEVENLABS_OUTPUT_FORMAT || 'mp3_22050_32' }}
        with:
          host: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY || vars.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || vars.SERVER_PORT || 22 }}
          # Longer than every timeout inside the script, so a failure is always
          # reported by the script rather than by the session being cut off.
          command_timeout: 20m
          envs: APP_IMAGE,GHCR_USER,GHCR_TOKEN,JWT_SECRET,POSTGRES_PASSWORD,DOMAIN,ACME_EMAIL,SERVER_HOST,DEPLOY_DIR,TELEPHONY_PROVIDER,PUBLIC_BASE_URL,TELEPHONY_WEBHOOK_TOKEN,EXOTEL_SID,EXOTEL_API_KEY,EXOTEL_API_TOKEN,EXOTEL_CALLER_ID,EXOTEL_SUBDOMAIN,EXOTEL_FLOW_APP_ID,EXOTEL_STATUS_CALLBACK_EVENTS,EXOTEL_MAX_RETRIES,STUCK_CALL_TIMEOUT_MINUTES,STORAGE_PROVIDER,S3_BUCKET,S3_ENDPOINT_URL,S3_REGION,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,FETCH_PROVIDER_RECORDINGS,RECORDING_RETENTION_DAYS,EMBEDDING_PROVIDER,VOYAGE_API_KEY,EMBEDDING_MODEL,SPEECH_PROVIDER,LLM_PROVIDER,VOICE_PROVIDER,ANTHROPIC_API_KEY,LLM_MODEL,ELEVENLABS_API_KEY,ELEVENLABS_VOICE_ID,ELEVENLABS_MODEL_ID,ELEVENLABS_OUTPUT_FORMAT
          script: |
            set -e
            cd "${DEPLOY_DIR}"

            # Traefik routes on Host(DOMAIN) and gets its certificate from
            # Let's Encrypt, so a domain is not optional here. Without one the
            # router never loads and the site is unreachable — say so now
            # rather than after the stack is up and answering nothing.
            if [ -z "${DOMAIN}" ]; then
              echo "ERROR: DOMAIN is not set."
              echo "Set it to the hostname pointed at this server, e.g."
              echo "  DOMAIN=voice.example.com   (Actions variable)"
              echo "  ACME_EMAIL=ops@example.com (Actions variable)"
              exit 1
            fi
            if [ -z "${ACME_EMAIL}" ]; then
              echo "ERROR: ACME_EMAIL is not set; Let's Encrypt requires a contact address."
              exit 1
            fi
            # Telephony callbacks must arrive over HTTPS at the same name.
            if [ -z "${PUBLIC_BASE_URL}" ]; then
              PUBLIC_BASE_URL="https://${DOMAIN}"
            fi

            umask 077
            cat > .env <<EOF
            APP_IMAGE=${APP_IMAGE}
            DOMAIN=${DOMAIN}
            ACME_EMAIL=${ACME_EMAIL}
            JWT_SECRET=${JWT_SECRET}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            TELEPHONY_PROVIDER=${TELEPHONY_PROVIDER}
            PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
            TELEPHONY_WEBHOOK_TOKEN=${TELEPHONY_WEBHOOK_TOKEN}
            EXOTEL_SID=${EXOTEL_SID}
            EXOTEL_API_KEY=${EXOTEL_API_KEY}
            EXOTEL_API_TOKEN=${EXOTEL_API_TOKEN}
            EXOTEL_CALLER_ID=${EXOTEL_CALLER_ID}
            EXOTEL_SUBDOMAIN=${EXOTEL_SUBDOMAIN}
            EXOTEL_FLOW_APP_ID=${EXOTEL_FLOW_APP_ID}
            EXOTEL_STATUS_CALLBACK_EVENTS=${EXOTEL_STATUS_CALLBACK_EVENTS}
            EXOTEL_MAX_RETRIES=${EXOTEL_MAX_RETRIES}
            STUCK_CALL_TIMEOUT_MINUTES=${STUCK_CALL_TIMEOUT_MINUTES}
            STORAGE_PROVIDER=${STORAGE_PROVIDER}
            S3_BUCKET=${S3_BUCKET}
            S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
            S3_REGION=${S3_REGION}
            S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
            S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
            FETCH_PROVIDER_RECORDINGS=${FETCH_PROVIDER_RECORDINGS}
            RECORDING_RETENTION_DAYS=${RECORDING_RETENTION_DAYS}
            EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER}
            VOYAGE_API_KEY=${VOYAGE_API_KEY}
            EMBEDDING_MODEL=${EMBEDDING_MODEL}
            SPEECH_PROVIDER=${SPEECH_PROVIDER}
            LLM_PROVIDER=${LLM_PROVIDER}
            VOICE_PROVIDER=${VOICE_PROVIDER}
            ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
            LLM_MODEL=${LLM_MODEL}
            ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
            ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
            ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID}
            ELEVENLABS_OUTPUT_FORMAT=${ELEVENLABS_OUTPUT_FORMAT}
            EOF

            # PostgreSQL only reads POSTGRES_PASSWORD when it initialises an
            # empty data directory. Once the volume exists it keeps the password
            # it was built with, so rotating the secret leaves every connection
            # failing with "password authentication failed" and no hint as to
            # why. Catch that here rather than after a ten-minute wait.
            if [ -n "$(docker compose -f docker-compose.prod.yml ps -q db 2>/dev/null)" ]; then
              auth_ok=""
              for _ in $(seq 1 5); do
                # -h db, not 127.0.0.1. The postgres image's pg_hba trusts
                # loopback, so a check over 127.0.0.1 passes with any password
                # at all and proves nothing. The service name resolves to the
                # container's network address, which falls through to the
                # scram-sha-256 rule the app itself hits.
                if docker compose -f docker-compose.prod.yml exec -T \
                     -e PGPASSWORD="${POSTGRES_PASSWORD}" db \
                     psql -h db -U swaraj -d swaraj_solar -c 'select 1' >/dev/null 2>&1; then
                  auth_ok="yes"
                  break
                fi
                sleep 3
              done
              if [ -z "${auth_ok}" ]; then
                echo "ERROR: the running database rejects the current POSTGRES_PASSWORD."
                echo "Its volume was initialised with a different one, and Postgres"
                echo "ignores POSTGRES_PASSWORD on an existing data directory."
                echo
                echo "Keep the data — set the stored password to match the secret:"
                echo "  docker compose -f docker-compose.prod.yml exec db \\"
                echo "    psql -U swaraj -d swaraj_solar -c \"ALTER USER swaraj PASSWORD '<the secret>'\""
                echo
                echo "Or discard it, if there is nothing worth keeping yet:"
                echo "  docker compose -f docker-compose.prod.yml down -v"
                docker logout ghcr.io
                exit 1
              fi
            fi

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            docker compose -f docker-compose.prod.yml pull

            # `up -d` blocks while it waits for the app's healthcheck, because
            # worker and traefik depend on it being healthy. Bound that wait well
            # inside the SSH action's own limit: when the action times out it
            # kills the session mid-command, so the diagnostics below never run
            # and the failure arrives with no explanation at all.
            if ! timeout 420 docker compose -f docker-compose.prod.yml up -d --remove-orphans; then
              echo "=== Stack failed to start. Container states: ==="
              docker compose -f docker-compose.prod.yml ps || true
              echo "=== app ==="
              docker compose -f docker-compose.prod.yml logs --tail 120 app || true
              echo "=== db ==="
              docker compose -f docker-compose.prod.yml logs --tail 40 db || true
              echo "=== traefik ==="
              docker compose -f docker-compose.prod.yml logs --tail 40 traefik || true
              docker logout ghcr.io
              exit 1
            fi

            docker logout ghcr.io
            docker image prune -f

            echo "Waiting for the API to become healthy..."
            healthy=""
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
                healthy="yes"
                break
              fi
              sleep 5
            done
            if [ -z "${healthy}" ]; then
              echo "API did not become healthy in time; recent logs:"
              docker compose -f docker-compose.prod.yml logs --tail 100 app
              exit 1
            fi

            # The API answers, but customers only ever reach it through TLS, so a
            # broken proxy is a failed deploy — not a healthy one.
            # -k because the certificate may still be the self-signed default
            # while Let's Encrypt issues the real one on first deploy.
            echo "Checking HTTPS through Traefik at ${DOMAIN}..."
            for i in $(seq 1 24); do
              if curl -fsSk --resolve "${DOMAIN}:443:127.0.0.1" \
                   "https://${DOMAIN}/health" > /dev/null 2>&1; then
                echo "Deployment healthy over HTTPS."
                # The check above passes -k, so it says nothing about whether
                # the certificate is real. Say so explicitly: a self-signed
                # default warns in every browser and looks like an outage.
                # A first issue can lag the deploy, so this reports, never fails.
                if curl -fsS --resolve "${DOMAIN}:443:127.0.0.1" \
                     "https://${DOMAIN}/health" > /dev/null 2>&1; then
                  echo "Certificate verifies for ${DOMAIN}."
                  exit 0
                fi

                # Traefik holds on to a failed issue and does not retry on
                # any useful timescale, and `up -d` leaves it alone when its
                # own config has not changed. So after the DNS or firewall
                # fault that caused the failure is repaired, every later
                # deploy keeps serving the self-signed certificate until
                # someone restarts the proxy by hand. Do it here instead.
                echo "Serving the self-signed certificate; restarting Traefik"
                echo "to retry issuance..."
                docker compose -f docker-compose.prod.yml restart traefik
                for _ in $(seq 1 18); do
                  sleep 5
                  if curl -fsS --resolve "${DOMAIN}:443:127.0.0.1" \
                       "https://${DOMAIN}/health" > /dev/null 2>&1; then
                    echo "Certificate verifies for ${DOMAIN}."
                    exit 0
                  fi
                done

                echo "NOTE: still serving Traefik's self-signed certificate —"
                echo "Let's Encrypt has not issued for ${DOMAIN}, so browsers"
                echo "will warn. HTTP-01 needs ${DOMAIN} to resolve to this"
                echo "server with port 80 reachable from the internet. ACME log:"
                docker compose -f docker-compose.prod.yml logs --tail 200 \
                  traefik 2>&1 | grep -i acme | tail -10 || true
                exit 0
              fi
              sleep 5
            done
            echo "HTTPS did not answer in time; recent proxy logs:"
            docker compose -f docker-compose.prod.yml logs --tail 100 traefik
            # This one failure mode reads as a healthy stack that 404s
            # everything, so name it rather than leaving it in the log dump.
            if docker compose -f docker-compose.prod.yml logs traefik 2>&1 \
                 | grep -q "is too old"; then
              echo
              echo "Traefik could not talk to the Docker daemon, so it never read"
              echo "the routing labels and has no route to the API. The traefik"
              echo "image is older than this host's Docker Engine allows: use"
              echo "traefik:v3.6 or newer in deploy/docker-compose.prod.yml."
            fi
            exit 1
